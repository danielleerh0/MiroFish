services:
  scenarioiq:
    build: .
    image: scenarioiq:local
    container_name: scenarioiq
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
      # SQLite landscape store (added in v2 persistence work)
      - ./data:/app/data
